{% load static %}<!doctype html>
<html lang="en-GB">
  <head>
{% include "public/_head.html" %}
    <script src="{% static 'js/saved_boards.js' %}" defer></script>
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:description" content="{{ description }}" />
    {# No og:url (DESIGN.md, "The front page"): the chat already has the link. #}
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Traintrackr" />
    <meta property="og:image" content="{{ share_image }}" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{ share_image_alt }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="{% static 'icons/icon-180.png' %}" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
{% include "public/_header.html" %}
    <main id="main">{% block content %}{% endblock %}</main>
{% include "public/_footer.html" %}
  </body>
</html>
