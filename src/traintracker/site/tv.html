<!doctype html>
<html lang="en-GB" class="tv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <link rel="canonical" href="{{ page_url }}" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="{{ icon }}" type="image/svg+xml" />
    <link rel="icon" href="{{ icon_png }}" sizes="32x32" type="image/png" />
    <link rel="stylesheet" href="{{ stylesheet }}" />
    <script src="{{ script }}" defer></script>
    <script async data-domain="traintrackr.live" src="https://fiveb.ar/js/tally.js"></script>
  </head>
  <body>
    <!-- A board on a TV (?tv=1): the board alone, filling the screen, with no
         header or footer. site.js keeps the screen awake, hides the cursor
         and reloads the page once a night. -->
    <main id="main">{{ content }}</main>
  </body>
</html>
