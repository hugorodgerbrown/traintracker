{% extends "public_base.html" %}
{% block title %}Sign in · Traintrackr{% endblock %}
{% block content %}
  <h1>Sign in to Traintrackr</h1>
  <p>Continue as <strong>{{ email }}</strong>.</p>
  {# A button, not an automatic sign-in: mail scanners open links, and would use this one up. #}
  <form method="post">
    {% csrf_token %}
    <button type="submit">Continue</button>
  </form>
{% endblock %}
