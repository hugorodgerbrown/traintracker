# Render Blueprint: the Django app, the morning timetable refresh and a
# nightly clean-up. Deploying it is `titan deploy` (see the README).
#
# Settings come from two env groups that titan makes before this Blueprint
# is deployed, so the first deploy already has every value it needs:
#
# - titan: shared by every Titan app (debug off, the Python version, hosts
#   and origins under the parent domain, the SMTP relay).
# - traintracker: this app's own (DATABASE_URL, DJANGO_SECRET_KEY,
#   ACCOUNTS_EMAIL_KEY, the mail key and sender, SITE_URL and FIVEBAR_DOMAIN).
#
# Both are referenced here, not declared, so a Blueprint sync never
# overwrites them. To override a shared value for this app only, set it on
# the service: a service's own env vars win over its groups'. The rail
# data's keys are this app's alone, so they are set on the services below.
#
# uv is pinned: the build runs with the service's secrets in its environment,
# so it installs a known version, and uv then installs exactly what uv.lock lists.
# Raise the version here and in .github/workflows/ci.yml together.
services:
  - type: web
    name: traintracker
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: >-
      pip install uv==0.12.19 && uv sync --locked --no-dev &&
      uv run --no-sync python manage.py collectstatic --noinput
    # Runs before each deploy goes live; a failed migration stops the deploy.
    preDeployCommand: uv run --no-sync python manage.py migrate --noinput
    # One worker, with threads: the train tools share one event loop, one
    # Darwin budget and one journey network per process, and the network is
    # held in memory once (docs/decisions/the-train-tools-run-on-one-event-loop.md).
    # The access log has each request's path but not its query string or
    # referrer, which can carry an email address (the admin's user search).
    startCommand: >-
      uv run --no-sync gunicorn config.wsgi --bind 0.0.0.0:$PORT
      --workers 1 --threads 8 --timeout 90 --access-logfile -
      --access-logformat '%(h)s %(t)s "%(m)s %(U)s %(H)s" %(s)s %(b)s %(L)s "%(a)s"'
    # Answers 200 while the process is up; no sign-in, no database query.
    # (/healthz also reads the database, for uptime monitors and titan.)
    healthCheckPath: /livez
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: titan
      - fromGroup: traintracker
      - key: DARWIN_API_KEY
        sync: false
      # The token OpenAI's plugin portal issued for the domain check.
      - key: OPENAI_APPS_CHALLENGE
        sync: false
      # The cron job below refreshes the timetable; the web service only reads it.
      - key: TIMETABLE_AUTO_REFRESH
        value: "0"

  # 06:30 UTC (06:30 GMT / 07:30 BST): after Network Rail publishes the daily
  # extract at about 06:00 UK time.
  - type: cron
    name: traintracker-refresh
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "30 6 * * *"
    buildCommand: pip install uv==0.12.19 && uv sync --locked --no-dev
    startCommand: uv run --no-sync python manage.py refresh_timetable --commit
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: titan
      - fromGroup: traintracker
      - key: NR_USERNAME
        sync: false
      - key: NR_PASSWORD
        sync: false

  # Deletes what the privacy policy says is deleted: expired idempotency
  # records (24 hours), sign-in requests (15 minutes), expired OAuth tokens,
  # and accounts unused for 180 days.
  - type: cron
    name: traintracker-purge
    runtime: python
    region: frankfurt
    plan: starter
    schedule: "17 3 * * *"
    buildCommand: pip install uv==0.12.19 && uv sync --locked --no-dev
    startCommand: >-
      uv run --no-sync python manage.py purge_idempotency_records --commit &&
      uv run --no-sync python manage.py purge_sign_in_requests --commit &&
      uv run --no-sync python manage.py cleartokens &&
      uv run --no-sync python manage.py purge_idle_accounts --commit
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: titan
      - fromGroup: traintracker
