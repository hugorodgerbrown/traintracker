# Weekly updates for the locked Python dependencies and the pinned Actions.
# The uv version (render.yaml, tox.yml) and the tox versions (tox.yml) are
# written into commands, which Dependabot doesn't read: raise those by hand.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
