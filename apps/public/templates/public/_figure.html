{# The board: a table of the trains, which site.js draws as flaps. #}
<figure class="departures live" data-feed="{{ key.feed }}" data-refresh="{{ refresh }}"
  data-station="{{ key.crs }}" data-by="{{ key.by }}"{% if rows %} data-rows="{{ rows }}"{% endif %}>
  <div class="panel">
    <div class="station">
      {% if mode == "home" %}<h2>{{ board.station.name }}</h2>{% else %}<h1>{{ board.station.name }}</h1>{% endif %}
      <span>{{ kind }}</span>
      <time class="clock" datetime="{{ now|date:'c' }}">{{ now|time:'H:i:s' }}</time>
    </div>
    <div class="trains">
      <table>
        <caption>{{ kind }} from {{ board.station.name }}</caption>
        <thead><tr><th>Time</th><th>Destination</th><th>Plat</th><th>Expected</th></tr></thead>
        <tbody>
{% for t in trains %}<tr><td>{{ t.time }}</td><td data-label="Destination">{{ t.place }}</td><td data-label="Platform">{{ t.platform }}</td><td data-label="Expected" data-expected="{{ t.expected }}">{{ t.said }}</td></tr>
{% endfor %}        </tbody>
      </table>
    </div>
    <p class="empty" data-empty="{{ empty }}"{% if trains %} hidden{% endif %}>{{ problem|default:empty }}</p>
    <p class="stale-note" hidden></p>
    <ul class="notes">{% for m in board.messages %}<li>{{ m }}</li>{% endfor %}</ul>
    <p class="source"><span class="credit">{% if board.source == "darwin" %}<a href="https://www.nationalrail.co.uk/" target="_blank" rel="noopener">Powered by National Rail Enquiries</a>{% else %}Booked times: Network Rail data feeds (OGL v3.0){% endif %}</span>{% if mode == "embed" %} · <a href="/{{ board_path }}" target="_blank" rel="noopener">Traintrackr</a>{% endif %}
      · <span class="updated">Updated {{ board.updated }}</span><span class="next"></span>
      <span class="status" role="status"></span></p>
    <button type="button" class="fullscreen quiet" hidden>Full screen</button>
  </div>
{% if mode == "home" %}  <figcaption>
    Live departures from {{ board.station.name }}. Ask to see a board (<em>show me
    the departures board for Liverpool Street</em>) and Claude or ChatGPT draws one
    like it in the chat. Or <a href="/board">open a live board</a> for your own
    station, to share or put on your own page.
  </figcaption>
{% endif %}</figure>
