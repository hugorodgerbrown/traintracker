[project]
name = "traintracker"
version = "0.1.0"
description = "MCP server for GB train times: live boards (Darwin), a local Network Rail timetable, and journey planning."
readme = "README.md"
authors = [{ name = "Hugo Rodger-Brown", email = "hugo@rodger-brown.com" }]
requires-python = ">=3.14,<3.15"
license = { text = "MIT" }
dependencies = [
    # The Titan project: Django and what the template runs it with.
    "dj-database-url>=3.1.2,<4",
    "django>=6.1.1,<6.2",
    "gunicorn>=26.2.0,<27",
    "python-decouple>=3.8,<4",
    "whitenoise>=6.12.0,<7",
    # The MCP server (src/traintracker), which production runs until Titan 4/4.
    "mcp>=2.2,<3",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.3.6,<4",
    "pydantic>=2.10",
    "rapidfuzz>=3.10",
    "uvicorn>=0.30",
]

[project.scripts]
traintracker = "traintracker.server:main"

# One group per tox env, so each env installs only what it needs. `dev`
# composes them all for a local `uv sync`.
[dependency-groups]
test = [
    "factory-boy>=3.3.3,<4",
    "freezegun>=1.5.5,<2",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0,<8",
    "pytest-django>=4.14.0,<5",
    "pytest-xdist>=3.8.0,<4",
    "respx>=0.22",
]
lint = [
    # Exact pin, bumped in step with .pre-commit-config.yaml so the hook and
    # CI never disagree.
    "ruff==0.16.10",
]
types = [
    "django-stubs>=6.0.2,<7",
    "mypy>=2.3.0,<2.5",
    # mypy checks tests/ too, so it needs their packages.
    {include-group = "test"},
]
dev = [
    "pre-commit>=4.6.1,<5",
    "tox>=4.52.1,<5",
    "tox-uv>=1.0,<2",
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "types"},
]

# The MCP server is still an installed package with its `traintracker`
# command, which render.yaml runs. The Django project (manage.py, config/,
# apps/) runs from the checkout, as in every Titan app.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traintracker"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "B", "UP", "DJ",
    "S",    # flake8-bandit: security
    "SIM",  # simplifications
    "C4",   # comprehensions
    "PT",   # pytest style
    "PIE",
    "RET",
    "RUF",
    "T20",  # stray print()
    "DTZ",  # naive datetimes
    "D",    # a docstring on every module, class and function
]
ignore = [
    "RUF012",  # Django's Meta and admin options are mutable class attributes by design.
    "D105", "D107",  # dunder methods and __init__ are documented by their class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"**/migrations/*" = ["D"]
# The MCP server and its tests came over from the Starlette app with their own,
# smaller rule set. Titan 2/4 moves them into apps/ and brings them up to these
# rules (docstrings and all); until then they are held to the old set, plus
# every rule here that they already pass. The SQL is built with f-strings
# around schema names, which config.py checks against SCHEMA_NAME, never
# around values. print() is the command line's output.
"src/traintracker/**" = ["D", "S101", "S104", "S105", "S106", "S608", "T201", "DTZ007"]
"tests/traintracker/**" = ["D", "S101", "S105", "S106", "S608", "PT018", "DTZ001"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
strict_optional = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["/migrations/", "^\\.venv/", "^node_modules/"]

# The MCP server was checked with --strict before it came onto the template,
# and stays that way. (strict itself is global-only, so its flags are listed.)
[[tool.mypy.overrides]]
module = ["traintracker", "traintracker.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["decouple", "factory", "factory.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
source = ["apps", "config", "src/traintracker"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
fail_under = 90
skip_empty = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:"]
