{% load static %}{# What every public page's <head> has: the layout's, the embed's and the TV's. #}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <link rel="icon" href="{% static 'icons/icon.svg' %}" type="image/svg+xml" />
    <link rel="icon" href="{% static 'icons/icon-32.png' %}" sizes="32x32" type="image/png" />
    <link rel="stylesheet" href="{% static 'css/site.css' %}" />
    <script src="{% static 'js/site.js' %}" defer></script>
    {% if analytics.domain %}<script async data-domain="{{ analytics.domain }}" src="{{ analytics.script }}"></script>{% endif %}
