[tox]
requires =
    tox>=4.21
    tox-uv>=1.13
env_list = format, lint, type, tests

[testenv]
base_python = py311
runner = uv-venv-lock-runner
dependency_groups = dev

[testenv:format]
description = Check formatting with ruff
skip_install = true
commands = ruff format --check {posargs:src tests}

[testenv:lint]
description = Lint with ruff
skip_install = true
commands = ruff check {posargs:src tests}

[testenv:type]
description = Type-check with mypy
commands = mypy {posargs}

[testenv:tests]
description = Run the test suite (needs Postgres; see TEST_DATABASE_URL in tests/conftest.py)
pass_env = TEST_DATABASE_URL
commands = pytest {posargs}
